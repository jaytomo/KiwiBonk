<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiwi Beak Bonk</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell">
    <header class="hud">
      <h1>Kiwi Beak Bonk</h1>
      <div class="stats">
        <span>Score: <strong id="score">0</strong></span>
        <span>Time: <strong id="timer">60</strong>s</span>
        <span>Target: <strong id="target">160</strong></span>
      </div>
    </header>

    <section class="arena-wrap">
      <canvas id="game" width="960" height="540" aria-label="Kiwi bonk game canvas"></canvas>
      <div id="overlay" class="overlay">
        <h2 id="overlayTitle">Bonk Time!</h2>
        <p id="overlayText">Move your kiwi, jab with your long beak (Space), and bonk wild targets to win.</p>
        <button id="startBtn" type="button">Start Round</button>
      </div>
    </section>

    <footer class="controls">
      <p><strong>Move:</strong> WASD / Arrow Keys</p>
      <p><strong>Bonk Beak:</strong> Space</p>
      <p><strong>Restart:</strong> R</p>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
